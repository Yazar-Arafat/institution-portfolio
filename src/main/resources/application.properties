spring.application.name=institution-portfolio

# --- Europe PMC ---------------------------------------------------------------------------------
europepmc.grist-base-url=https://www.ebi.ac.uk/europepmc/GristAPI
europepmc.articles-base-url=https://www.ebi.ac.uk/europepmc/webservices/rest
# Per HTTP request: time allowed to connect, and to receive a response once connected.
# Most Articles API searches answer in 1-2 s, but uncached searches with no hits were seen taking ~13 s.
europepmc.connect-timeout=3s
europepmc.read-timeout=15s
# Most Articles API requests in flight at once, across all incoming requests
europepmc.max-concurrent-lookups=4
# Deadline for each grant's publication lookup, including time spent waiting for a free slot
europepmc.lookup-timeout=20s

# --- API documentation ----------------------------------------------------------------------------
# Swagger UI at http://localhost:8080/ (also /swagger-ui.html); OpenAPI JSON at /v3/api-docs.
# Enabled on purpose: this API is meant to be explored.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.try-it-out-enabled=true
