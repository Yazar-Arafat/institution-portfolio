name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit and integration tests. Europe PMC is replaced by local stubs, so this never calls the live APIs.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build the Docker image
        run: docker build -t institution-portfolio .

      # Start the image as the README describes and check it serves requests (no Europe PMC calls needed).
      - name: Smoke-test the container
        run: |
          docker run -d --name portfolio -p 8080:8080 institution-portfolio
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:8080/actuator/health && break
            sleep 2
          done
          curl -fs http://localhost:8080/actuator/health || { docker logs portfolio; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/institution-portfolio?institution=Cambridge&limit=11')
          echo "Invalid limit returned HTTP $status"
          test "$status" = 400
